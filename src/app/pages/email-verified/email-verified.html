<section class="verified-page">
  <div class="verified-card">
    <div class="success-icon"><i class="bi bi-check-lg"></i></div>
    <span class="eyebrow">Sikeres megerősítés</span>
    <h1>Az email címed megerősítve</h1>
    <p>A Getingo fiókod készen áll. Most már mentheted a haladásodat, gyűjthetsz XP-t és fejlesztheted a Buddyt.</p>

    @if (sessionChecked) {
      @if (user) {
        <a class="primary-link" [routerLink]="user.role === 'admin' ? '/admin' : '/dashboard'">
          Tovább a fiókomhoz <i class="bi bi-arrow-right"></i>
        </a>
      } @else {
        <a class="primary-link" routerLink="/login">
          Bejelentkezés <i class="bi bi-arrow-right"></i>
        </a>
      }
    }
  </div>
</section>
